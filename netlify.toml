[build]
  command = "npm run build"
  publish = "dist/public"

# Force pretty URLs (no trailing slashes)
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Redirect trailing slashes to non-trailing (301)
[[redirects]]
  from = "/pdfs/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/downloads/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/$"
  to = "/"
  status = 301

# Same API paths as Cloudflare Pages.
[[redirects]]
  from = "/api/mhc-checkout"
  to = "/.netlify/functions/mhc-checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/mhc-order"
  to = "/.netlify/functions/mhc-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/mhc-webhook"
  to = "/.netlify/functions/mhc-webhook"
  status = 200
  force = true

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/myhealthcanvas/thank-you"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

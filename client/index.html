    <!-- Structured Data - FAQPage (First 30 Days) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What should I do in the first 30 days after a cancer diagnosis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Focus on three phases: Week 1 - allow yourself to process the shock, write down your next appointment date, and identify one trusted person to talk to. Week 2 - start organizing by writing down questions for your oncologist, gathering your medical records, and understanding your diagnosis. Weeks 3-4 - prepare for treatment by understanding your care plan, exploring financial assistance, and building your support network."
          }
        },
        {
          "@type": "Question",
          "name": "What questions should I ask my oncologist at the first appointment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Key questions include: What type and stage is my cancer? What are my treatment options? What are the side effects? What is the goal of treatment? Should I get a second opinion? What clinical trials are available? What support services does the hospital offer?"
          }
        },
        {
          "@type": "Question",
          "name": "How can a caregiver help after a cancer diagnosis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Caregivers can help by: forwarding medical emails to a shared folder, taking photos of appointment letters and prescriptions, creating one shared Google Drive or iCloud folder for all documents, attending appointments to take notes, and helping research financial assistance programs. Being present is enough — you don't need to fix everything."
          }
        },
        {
          "@type": "Question",
          "name": "What financial help is available for cancer patients?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Many drug manufacturers offer Patient Support Programs (PSPs) that provide financial assistance, co-pay support, or free medication. Search for your drug name plus 'Patient Support Program'. Foundations like CancerCare, Patient Advocate Foundation, and local charities also offer grants and financial aid."
          }
        }
      ]
    }
    </script>

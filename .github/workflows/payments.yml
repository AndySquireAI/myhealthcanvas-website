name: Payment checks
on: [pull_request, push]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes pnpm@10.4.1 install --frozen-lockfile
      - run: npm run test:payments
      - run: npm run check
      - run: npm run build
      - run: npx wrangler pages functions build --compatibility-flags=nodejs_compat --outdir=.netlify/cloudflare-check
